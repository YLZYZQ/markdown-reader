<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self' file: data: blob: https:;
                 media-src 'self' file: data: blob:;
                 font-src 'self' data:;
                 connect-src 'none';
                 object-src 'none';
                 base-uri 'self' file:;
                 form-action 'none';" />
  <base id="document-base" href="./" />
  <title>Markdown阅读器</title>
  <!-- Toast UI Editor 离线资源（esbuild 打包的单文件 bundle + CSS） -->
  <link rel="stylesheet" href="tui-editor/toastui-editor.css" />
  <link rel="stylesheet" href="tui-editor/toastui-editor-dark.css" />
  <link rel="stylesheet" href="tui-editor/toastui-editor-plugin-code-syntax-highlight.css" />
  <link rel="stylesheet" href="tui-editor/prism.css" />
  <script src="tui-editor/editor-bundle.js"></script>
  <script src="../lib/app-i18n.js"></script>
  <script src="../lib/outline.js"></script>
  <script src="../lib/mermaid-html-renderer.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-light">
  <!-- 顶部工具条 -->
  <header class="titlebar">
    <div class="title-left">
      <button id="btn-sidebar" class="tb-btn icon-btn sidebar-toggle" title="显示/隐藏文件侧边栏 (Ctrl+Shift+E)" aria-label="显示或隐藏文件侧边栏" aria-expanded="true">☰</button>
      <span class="file-icon" aria-hidden="true">M↓</span>
      <span id="filename" class="filename">未命名.md</span>
    </div>
    <div class="title-right">
      <button id="btn-new" class="tb-btn" title="新建 (Ctrl+N)">新建</button>
      <button id="btn-open" class="tb-btn" title="打开 (Ctrl+O)">打开</button>
      <button id="btn-save" class="tb-btn" title="保存 (Ctrl+S)">保存</button>
      <span class="tb-separator" aria-hidden="true"></span>
      <button id="btn-find" class="tb-btn icon-btn" title="查找 (Ctrl+F)" aria-label="查找">⌕</button>
      <button id="btn-mode" class="tb-btn icon-btn" title="切换源码模式 (Ctrl+/)" aria-label="切换源码/所见即所得模式">&lt;/&gt;</button>
      <button id="btn-focus" class="tb-btn icon-btn" title="专注模式 (F8)" aria-label="专注模式" aria-pressed="false">◎</button>
      <button id="btn-reading-settings" class="tb-btn icon-btn" title="阅读与排版设置" aria-label="阅读与排版设置" aria-expanded="false" aria-controls="reading-settings">Aa</button>
      <button id="btn-theme" class="tb-btn icon-btn" title="切换主题 (Ctrl+Shift+T)" aria-label="切换主题">
        <span id="theme-icon" aria-hidden="true">◐</span>
      </button>
    </div>
  </header>

  <!-- 文件侧边栏与编辑器 -->
  <main id="workspace" class="workspace">
    <aside id="file-sidebar" class="file-sidebar" aria-label="当前文档目录">
      <div class="sidebar-header">
        <div class="sidebar-heading">
          <span class="sidebar-title">文件</span>
          <span id="sidebar-root" class="sidebar-root" title="尚未打开文档">尚未打开文档</span>
        </div>
        <button id="btn-tree-up" class="sidebar-action" title="返回上一级目录" aria-label="返回上一级目录" hidden>↩</button>
        <button id="btn-sidebar-refresh" class="sidebar-action" title="刷新目录" aria-label="刷新目录">↻</button>
      </div>
      <nav class="sidebar-tabs" role="tablist" aria-label="侧边栏视图">
        <button id="tab-files" class="sidebar-tab active" type="button" role="tab" aria-selected="true">文件</button>
        <button id="tab-outline" class="sidebar-tab" type="button" role="tab" aria-selected="false">大纲</button>
      </nav>
      <div id="file-tree" class="file-tree" role="tabpanel" aria-label="文件列表">
        <div class="sidebar-empty" data-i18n="sidebar.emptyTree">打开或保存文档后，将显示同目录下的文件。</div>
      </div>
      <div id="outline-panel" class="outline-panel" role="tabpanel" aria-label="文档大纲" hidden>
        <div id="outline-list" class="outline-list">
          <div class="sidebar-empty">当前文档没有标题。</div>
        </div>
      </div>
    </aside>
    <div id="editor"></div>
  </main>

  <!-- 阅读与排版设置 -->
  <section id="reading-settings" class="reading-settings" aria-label="阅读与排版" hidden>
    <h2>阅读与排版</h2>
    <div class="settings-row"><label for="font-size">正文字号</label><select id="font-size"><option value="14">14 px</option><option value="16">16 px · 舒适</option><option value="18">18 px</option><option value="20">20 px · 大字</option><option value="22">22 px</option></select></div>
    <div class="settings-row"><label for="line-width">正文宽度</label><select id="line-width"><option value="640">窄 · 640 px</option><option value="780">标准 · 780 px</option><option value="960">宽 · 960 px</option></select></div>
    <div class="settings-row"><label for="theme-select">外观</label><select id="theme-select"><option value="system">跟随系统</option><option value="light">浅色</option><option value="cream">奶油白</option><option value="dark">深色</option></select></div>
    <div class="settings-row"><label for="typewriter-toggle">打字机模式 <small>光标保持居中</small></label><input id="typewriter-toggle" type="checkbox" /></div>
    <p>专注模式 F8 · 退出专注 Esc<br />显示偏好会自动记住。</p>
  </section>

  <!-- 查找与替换面板 -->
  <section id="find-panel" class="find-panel" aria-label="查找与替换" hidden>
    <div class="find-row">
      <button id="btn-find-expand" class="find-icon-btn" title="展开替换" aria-label="展开替换">⌄</button>
      <input id="find-input" type="text" autocomplete="off" placeholder="查找" aria-label="查找内容" />
      <span id="find-count" class="find-count">0 处</span>
      <button id="btn-find-prev" class="find-icon-btn" title="上一个 (Shift+Enter)" aria-label="上一个">↑</button>
      <button id="btn-find-next" class="find-icon-btn" title="下一个 (Enter/F3)" aria-label="下一个">↓</button>
      <button id="btn-find-close" class="find-icon-btn" title="关闭 (Esc)" aria-label="关闭">×</button>
    </div>
    <div class="find-row replace-row">
      <span class="find-indent" aria-hidden="true"></span>
      <input id="replace-input" type="text" autocomplete="off" placeholder="替换为" aria-label="替换内容" />
      <label class="case-option"><input id="find-case-sensitive" type="checkbox" /> 区分大小写</label>
      <button id="btn-replace" class="find-action-btn">替换</button>
      <button id="btn-replace-all" class="find-action-btn">全部替换</button>
    </div>
  </section>

  <!-- 底部状态栏 -->
  <footer class="statusbar">
    <div class="status-left">
      <span id="status-info">就绪</span>
      <span id="reading-progress" title="当前文档阅读进度">0%</span>
    </div>
    <div class="status-right">
      <span id="cursor-pos" title="光标位置"></span>
      <span id="reading-time" title="预计阅读时间"></span>
      <span id="word-count" class="word-count">0 字</span>
      <span id="zoom-level" title="缩放级别"></span>
    </div>
  </footer>

  <!-- 拖拽遮罩 -->
  <div id="drop-overlay" class="drop-overlay">
    <div class="drop-inner">
      <div class="drop-icon">📁</div>
      <div>松开以打开 Markdown 文件</div>
    </div>
  </div>

  <script src="reading-experience.js"></script>
  <script src="app.js"></script>
</body>
</html>
